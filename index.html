<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kasir Bakso Pak Sidiq</title>
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --bg: #f0f3f5; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        .header { text-align: center; padding: 15px; background: var(--white); border-radius: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .menu-card { background: var(--white); border-radius: 15px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid var(--accent); }
        .btn { width: 40px; height: 40px; border-radius: 10px; border: none; font-size: 1.2em; font-weight: bold; cursor: pointer; }
        .btn-m { background: #fee2e2; color: #c0392b; }
        .btn-p { background: #dcfce7; color: #27ae60; }
        .qty { font-size: 1.2em; font-weight: bold; min-width: 30px; text-align: center; }
        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--primary); padding: 15px; color: white; text-align: center; }
        .save-btn { width: 90%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 10px; font-size: 1.1em; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0; color:var(--primary);">BAKSO PAK SIDIQ</h2>
</div>

<div id="daftar-menu" style="padding-bottom: 100px;">
    <!-- Menu muncul otomatis di sini -->
</div>

<div class="bottom-bar">
    <div style="margin-bottom:10px; font-size: 1.2em;">Total: <span id="display-total" style="color:var(--accent); font-weight:bold;">Rp 0</span></div>
    <button class="save-btn" onclick="prosesSimpan()">SIMPAN PENJUALAN</button>
</div>

<script>
    // MASUKKAN LINK APPS SCRIPT BAPAK DI SINI
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbyI76Hh7v3S34O8jZ2W47yPj8Q-2R4iX0G0-b6S/exec";

    const daftarBakso = [
        { nama: "Bakso Urat", harga: 11000 },
        { nama: "Bakso Halus", harga: 12000 },
        { nama: "Bakso Mercon", harga: 15000 },
        { nama: "Bakso Urat Jumbo", harga: 15000 },
        { nama: "Bakso Urat Super Jumbo", harga: 20000 },
        { nama: "Bakso Tetelan", harga: 20000 },
        { nama: "Bakso Balungan", harga: 20000 },
        { nama: "Bakso Iga", harga: 25000 },
        { nama: "Mie Ayam", harga: 9000 },
        { nama: "Mie Ayam Bakso", harga: 14000 },
        { nama: "Mie Ayam Bakso Jumbo", harga: 18000 }
    ];

    let keranjang = {};

    function tampilkanMenu() {
        const wadah = document.getElementById('daftar-menu');
        wadah.innerHTML = daftarBakso.map((item, i) => {
            keranjang[i] = 0;
            return `
                <div class="menu-card">
                    <div><b>${item.nama}</b><br><small>Rp ${item.harga.toLocaleString()}</small></div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <button class="btn btn-m" onclick="tambahKurang(${i}, -1)">-</button>
                        <span class="qty" id="qty-${i}">0</span>
                        <button class="btn btn-p" onclick="tambahKurang(${i}, 1)">+</button>
                    </div>
                </div>`;
        }).join('');
    }

    function tambahKurang(id, jumlah) {
        if(keranjang[id] + jumlah >= 0) {
            keranjang[id] += jumlah;
            document.getElementById(qty-${id}).innerText = keranjang[id];
            hitungTotal();
        }
    }

    function hitungTotal() {
        let total = 0;
        daftarBakso.forEach((item, i) => { total += (keranjang[i] * item.harga); });
        document.getElementById('display-total').innerText = "Rp " + total.toLocaleString('id-ID');
    }

    async function prosesSimpan() {
        const payload = { items: daftarBakso.map((item, i) => ({ nama: item.nama, harga: item.harga, qty: keranjang[i] })) };
        if(Object.values(keranjang).every(v => v === 0)) return alert("Pilih menu dulu, Pak!");
        
        try {
            alert("Sedang mengirim... Mohon tunggu.");
            await fetch(URL_SCRIPT, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            alert("Berhasil! Data sudah masuk ke Sheets.");
            location.reload();
        } catch (e) { alert("Gagal kirim! Cek koneksi atau link script."); }
    }

    tampilkanMenu();
</script>
</body>
</html>
