<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Bakso</title>
    <style>
        body { font-family: sans-serif; background: #f0f3f5; padding: 10px; margin: 0; }
        .header { background: #2c3e50; color: white; text-align: center; padding: 15px; border-radius: 10px; }
        .menu-card { background: white; border-radius: 12px; padding: 15px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-qty { width: 45px; height: 45px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-m { background: #fee2e2; color: #c0392b; }
        .btn-p { background: #dcfce7; color: #27ae60; }
        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #2c3e50; padding: 15px; text-align: center; }
        .btn-simpan { width: 90%; padding: 15px; background: #e67e22; color: white; border: none; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header"><h2>BAKSO PAK SIDIQ</h2></div>
    <div id="list-menu" style="padding-bottom: 100px;"></div>
    <div class="bottom-bar">
        <button class="btn-simpan" onclick="alert('Berhasil Simpan!')">SIMPAN PENJUALAN</button>
    </div>
    <script>
        const menu = [{n:"Bakso Urat", h:11000}, {n:"Bakso Halus", h:12000}, {n:"Mie Ayam", h:9000}];
        let data = {};
        function tampil() {
            document.getElementById('list-menu').innerHTML = menu.map((m,i) => {
                data[i] = 0;
                return `<div class="menu-card">
                    <div><b>${m.n}</b><br>Rp ${m.h}</div>
                    <div>
                        <button class="btn-qty btn-m" onclick="upd(${i},-1)">-</button>
                        <b id="v-${i}" style="margin: 0 10px">0</b>
                        <button class="btn-qty btn-p" onclick="upd(${i},1)">+</button>
                    </div>
                </div>`;
            }).join('');
        }
        function upd(i,v) { if(data[i]+v >= 0) { data[i]+=v; document.getElementById('v-'+i).innerText = data[i]; } }
        tampil();
    </script>
</body>
</html>
