<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Bakso Pak Sidiq</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f3f5; margin: 0; padding: 15px; }
        .header { background: #2c3e50; color: white; text-align: center; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .card { background: white; border-radius: 15px; padding: 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .uang { font-size: 2.5rem; font-weight: bold; color: #27ae60; margin: 10px 0; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; }
        th { background: #ecf0f1; padding: 12px; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
    </style>
</head>
<body>
    <div class="header"><h2 style="margin:0">MONITOR PENJUALAN</h2><small>Bakso Pak Sidiq</small></div>
    <div class="card"><div style="color:#7f8c8d">TOTAL PENDAPATAN HARI INI</div><div class="uang">Rp 0</div></div>
    <div class="card" style="text-align:left;">
        <h3 style="margin-top:0">Rincian Terjual</h3>
        <table>
            <tr><th>Menu</th><th>Qty</th><th>Total</th></tr>
            <tr><td colspan="3" style="color:#999; padding:20px;">Menunggu data...</td></tr>
        </table>
    </div>
</body>
</html>
